<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP - 05 - Felipe Slavic RM 565687</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body class="bg-light">

    <div class="py-4 px-5 bg-info rounded d-flex align-items-center gap-3">
        <h1 class="text-light display-5">Formulário de Compra :</h1>
        <h1 class="text-primary display-5">SAX GAMES</h1>
    </div>



    <section class="container my-5 p-2">


        <form id="formularioGames" name="formularioGames" method="get" action="">
                <div class=" row border p-4">

                <div class=" my-3 col-md-6">
                    <label for="nomeCliente" class="form-label">Nome</label>
                    <input type="text" id="nomeCliente" name="nomeCliente" class="form-control"
                        placeholder="ex: João Carlos" minlength="2" maxlength="30" required>
                </div>

                <div class=" my-3 col-md-6">
                    <label for="emailCliente" class="form-label">Email</label>
                    <input type="email" id="emailCliente" name="emailCliente" class="form-control"
                        placeholder="ex: seuemail@email.com" minlength="6" required>
                </div>

                <div class="my-3 col-md-4">
                    <label for="tipoCliente" class="form-label">Tipo de Cliente</label>
                    <select name="tipoCliente" id="tipoCliente" class="form-select" required>
                        <option disabled selected value="">Selecione o Tipo de Cliente</option>
                        <option value="Cliente A">Cliente A</option>
                        <option value="Cliente B">Cliente B</option>
                        <option value="Cliente C">Cliente C</option>
                    </select>

                </div>

                <div class="my-3 col-md-4">
                    <label for="tipoGame" class="form-label">Nome do Game</label>
                    <select name="tipoGame" id="tipoGame" class="form-select" required>
                        <option disabled selected value="">Selecione o Tipo de Game</option>
                        <option value="299.99"> Elden Ring - R$ 299,99</option>
                        <option value="349.5">Spider Man 2 - R$ 349,50</option>
                        <option value="249.0">Hogwarts Legacy - R$ 249,00</option>
                        <option value="359.9">The Legend of Zelda: Tears of the Kingdom - R$ 359,90</option>
                        <option value="319.9">Resident Evil 4 Remake - R$ 319,90</option>
                    </select>
                </div>

                <div class="my-3 col-md-4">
                    <label for="numParcelas" class="form-label">Número de Parcelas</label>
                    <select name="numParcelas" id="numParcelas" class="form-select" required>
                        <option disabled selected value="">Selecione o Número de Parcelas</option>
                        <option value="1">Pagamento à Vista (1x) </option>
                        <option value="2">2 Parcelas (2x)</option>
                        <option value="3">3 Parcelas (3x)</option>
                        <option value="4">4 Parcelas (4x)</option>
                    </select>
                </div>

                <div class="my-4 d-flex justify-content-end">
                    <button type="submit" class="btn btn-info btn-lg text-light px-4">Finalizar Compra</button>
                </div>

        </div>
        </form>

        <div class="mt-5 ">
            <h3 class="bg-info text-white p-2 rounded"> Relatório de Compras</h3>

            <div>
                <table  id="tabelaCompras" class="table table-bordered table-striped table-hover text-center my-3 rounded 
                table-responsive">
                    <thead class="table-info">
                        <tr>
                            <th class="text-primary" >Cliente</th>
                            <th class="text-primary">Email</th>
                            <th class="text-primary">Game</th>
                            <th class="text-primary">Tipo de Cliente</th>
                            <th class="text-primary">Número de Parcelas</th>
                            <th class="text-primary">Preço Original</th>
                            <th class="text-primary">Valor do Desconto</th>
                            <th class="text-primary">Valor Final</th>
                            <th class="text-primary">Valor Parcelado</th>
                        </tr>
                    </thead>
                    
                    <tbody id="dadosDaCompra"></tbody>
                    
                </table>
                
                
            </div>
        </div>

    </section>

    <script type="module" src="./js/formularioCompras.js"></script>
</body>


</html>
